# ==============================================================================
# 项目术语与命名统一词典 (Project Term & Naming Dictionary) — AI Reader
# 作用：建立全局统一语言（Ubiquitous Language）与单一事实源（Single Source of Truth），
#       消除同义词重复定义、语义漂移与事件/动作/时间戳混淆（如 update vs updated vs updated_at）。
#
# 说明：forbidden_alias 采用「保守裁剪」策略——只登记真正的领域同义漂移词，
#       刻意排除与构建系统 / 语言运行时 / SQL 方言冲突的通用英文词
#       （如 release/download profile、alter table、make/build 等），避免误伤工程代码。
# ==============================================================================

# 1. 语法与词态矩阵规则 (Lifecycle Grammar & Part-of-Speech Matrix)
grammar_rules:
  command:
    part_of_speech: "动词原形 (Imperative Verb)"
    convention: "snake_case 或 camelCase"
    example: "import_book / create_annotation"
    description: "表示发起一个动作或指令（请求尚未发生，可能被拒绝）"
  domain_event:
    part_of_speech: "名词.过去分词 (Past Participle) 或 PascalCase"
    convention: "<entity>.<action_past_tense> (如 book.imported / annotation.created)"
    example: "book.imported / annotation.created / BookImported"
    description: "表示领域内已经发生的事实（只读广播，严禁用动词原形如 book.import，严禁用时间戳如 updated_at）"
  property_timestamp:
    part_of_speech: "名词或过去分词 + _at"
    convention: "<action_past_tense>_at"
    example: "created_at / updated_at / deleted_at"
    description: "实体的时间戳属性，严禁用作动作名或事件名"
  payload_action:
    part_of_speech: "全大写动名词或动词 (Upper Snake Case)"
    convention: "CREATE / UPDATE / DELETE"
    example: "action: 'UPDATE'"
    description: "变更日志、CDC 或 FFI 信封内部的操作类型枚举"

# 2. 内置生命周期标准词汇 (Standard Lifecycle Built-in Terms)
lifecycle_terms:
  - concept: "创建 / 登记"
    command: "create"
    event: "created"
    timestamp: "created_at"
    payload_action: "CREATE"
    forbidden_alias: ["add_new", "make_new", "insert_entity"]

  - concept: "更新 / 修改"
    command: "update"
    event: "updated"
    timestamp: "updated_at"
    payload_action: "UPDATE"
    forbidden_alias: ["modify", "alter"]

  - concept: "删除 / 注销"
    command: "delete"
    event: "deleted"
    timestamp: "deleted_at"
    payload_action: "DELETE"
    forbidden_alias: ["destroy", "purge"]

  - concept: "导入 / 摄取"
    command: "import"
    event: "imported"
    timestamp: "imported_at"
    payload_action: "IMPORT"
    forbidden_alias: ["ingest", "intake", "load_in"]

  - concept: "解析 / 解构"
    command: "parse"
    event: "parsed"
    timestamp: "parsed_at"
    payload_action: "PARSE"
    forbidden_alias: ["deconstruct", "decode_doc"]

  - concept: "归档 / 沉淀"
    command: "archive"
    event: "archived"
    timestamp: "archived_at"
    payload_action: "ARCHIVE"
    forbidden_alias: ["sink", "deposit"]

# 3. 业务领域实体词典 (Domain Model & Business Terms)
terms:
  - term: "书库书籍"
    en_name: "book"
    abbr: "bk"
    scope: "domain_model"
    desc: "用户导入并被摄取入库的一篇 Markdown / TXT 长文读物（唯一阅读单元）"
    forbidden_alias: ["ebook", "volume", "booklet", "doc_item"]

  - term: "章节"
    en_name: "section"
    abbr: "sec"
    scope: "domain_model"
    desc: "书籍按标题层级切分出的结构化章节/段落块"
    # 注：刻意不把裸词 chapter 列为禁用别名——解析器需匹配书稿正文中字面的 "Chapter N" 标题
    forbidden_alias: ["chap", "chapter_node", "segment_block"]

  - term: "句子"
    en_name: "sentence"
    abbr: "sent"
    scope: "domain_model"
    desc: "章节内切分出的最小文本与划词锚点单元"
    forbidden_alias: ["text_line", "phrase_node"]

  - term: "标注"
    en_name: "annotation"
    abbr: "ann"
    scope: "domain_model"
    desc: "覆盖高亮 / 下划线 / 波浪线 / 边框 / 边注等 7 种样式、锚定到句子的用户标记"
    forbidden_alias: ["markup", "annot"]

  - term: "边注"
    en_name: "margin_note"
    abbr: "mnote"
    scope: "domain_model"
    desc: "锚定到句子或 AI 伴读结果的人工/AI 沉淀笔记（标注的一种样式）"
    forbidden_alias: ["side_note", "marginalia"]

  - term: "认知模板"
    en_name: "cognitive_template"
    abbr: "ctmpl"
    scope: "domain_model"
    desc: "划词伴读的四大解读视角枚举：通俗 / 逻辑 / 批判 / 术语"
    forbidden_alias: ["prompt_preset", "reading_mode_enum"]

  - term: "伴读会话"
    en_name: "conversation"
    abbr: "conv"
    scope: "domain_model"
    desc: "一次划词或原位追问所触发的 AI 认知伴读对话流（含多条消息）"
    forbidden_alias: ["chat_thread", "dialog_sess"]

  - term: "伴读消息"
    en_name: "message"
    abbr: "msg"
    scope: "domain_model"
    desc: "伴读会话中的单条消息（用户追问 / AI 流式答复）"
    forbidden_alias: ["chat_item", "reply_unit"]

  - term: "关键词"
    en_name: "keyword"
    abbr: "kw"
    scope: "domain_model"
    desc: "本地 NLP 从书籍抽取的术语词条及其权重（词云与导图数据源）"
    forbidden_alias: ["term_word", "tag_word"]

  - term: "关键词关系"
    en_name: "keyword_relation"
    abbr: "kwrel"
    scope: "domain_model"
    desc: "关键词之间的共现/邻接关系边"
    forbidden_alias: ["term_edge", "word_link"]

  - term: "导图节点"
    en_name: "mindmap_node"
    abbr: "mnode"
    scope: "domain_model"
    desc: "知识导图中的章节/概念节点"
    forbidden_alias: ["graph_vertex", "map_point"]

  - term: "阅读进度"
    en_name: "reading_progress"
    abbr: "rprog"
    scope: "domain_model"
    desc: "单本书的阅读位置、时长与完成度"
    forbidden_alias: ["read_pos", "scroll_state"]

  - term: "伴读设置"
    en_name: "companion_settings"
    abbr: "cset"
    scope: "domain_model"
    desc: "LLM 端点连接、模型、密钥（不回显）与伴读行为配置"
    forbidden_alias: ["llm_pref", "ai_config"]

  - term: "统一调用信封"
    en_name: "invoke_envelope"
    abbr: "env"
    scope: "contract"
    desc: "Flutter 与 Rust 引擎间统一的 C-ABI 调用契约 invoke(action, payload_json)"
    forbidden_alias: ["bridge_packet", "rpc_frame"]
